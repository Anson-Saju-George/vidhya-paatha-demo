services:
  vidhya-paatha:
    build:
      context: .
    ports:
      # Container port is always 8000; HOST_PORT is only the local publish port.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/vidhya-paatha-demo/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
