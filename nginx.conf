# Serves the built SPA at its original base path, container port 8000.
server {
  listen 8000;
  server_name _;
  root /usr/share/nginx/html;

  # Send the bare root to the app's base path.
  location = / {
    return 302 /vidhya-paatha-demo/;
  }

  # Base-path SPA: assets resolve under the prefix, unknown routes fall back to index.html.
  location /vidhya-paatha-demo/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /vidhya-paatha-demo/index.html;
  }
}
