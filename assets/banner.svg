<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1e3d"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="120" cy="80" r="3"/><circle cx="220" cy="80" r="3"/><circle cx="320" cy="80" r="3"/>
    <circle cx="1060" cy="320" r="3"/><circle cx="1160" cy="320" r="3"/><circle cx="960" cy="320" r="3"/>
    <circle cx="1160" cy="80" r="3"/><circle cx="1060" cy="80" r="3"/>
    <circle cx="120" cy="320" r="3"/><circle cx="220" cy="320" r="3"/>
  </g>

  <!-- logo tile -->
  <rect x="120" y="150" width="100" height="100" rx="24" fill="#ffffff"/>
  <text x="170" y="220" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#0f1e3d" text-anchor="middle">V</text>

  <!-- wordmark -->
  <text x="252" y="195" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="700" fill="#ffffff">VidyaPaatha</text>
  <text x="254" y="238" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" letter-spacing="8" fill="url(#amber)">PASSPORT</text>

  <!-- tagline -->
  <text x="122" y="300" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">A teacher&#39;s learning-memory system for Indian classrooms</text>

  <!-- right-side accent pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600">
    <rect x="900" y="158" width="260" height="44" rx="22" fill="#ffffff" opacity="0.08"/>
    <text x="924" y="186" fill="#cbd5e1">Identify gaps today</text>
    <rect x="900" y="212" width="260" height="44" rx="22" fill="#ffffff" opacity="0.08"/>
    <text x="924" y="240" fill="#cbd5e1">Remember what worked</text>
  </g>
</svg>
